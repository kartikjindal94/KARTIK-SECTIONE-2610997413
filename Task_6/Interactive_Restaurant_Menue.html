<!DOCTYPE html>
<html>
<head>
    <title>Interactive Restaurant Menu</title>
</head>
<body>

    <h1>Interactive Restaurant Menu</h1>

    <p>Click on any food item to learn more about it.</p>

    <img src="food-menu.png" alt="Restaurant Food Menu" width="700" height="500" usemap="#foodmap">

    <map name="foodmap">

        <area shape="circle" coords="115,145,80" href="https://en.wikipedia.org/wiki/Pizza" alt="Pizza" target="_blank">

        <area shape="circle" coords="315,145,80" href="https://en.wikipedia.org/wiki/Hamburger" alt="Burger" target="_blank">

        <area shape="rect" coords="430,55,665,235" href="https://en.wikipedia.org/wiki/French_fries" alt="French Fries" target="_blank">

        <area shape="rect" coords="430,275,665,465" href="https://en.wikipedia.org/wiki/Menu" alt="Menu Card" target="_blank">

        <area shape="poly" coords="20,275,195,275,205,465,30,465" href="https://en.wikipedia.org/wiki/Sandwich" alt="Sandwich" target="_blank">

        <area shape="poly" coords="220,275,395,275,405,465,230,465" href="https://en.wikipedia.org/wiki/Cake" alt="Cake Slice" target="_blank">

        <area shape="default" href="https://en.wikipedia.org/wiki/Food" alt="Other Food Area" target="_blank">

    </map>

</body>
</html>
