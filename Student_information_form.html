<!DOCTYPE html>
 <html lang="en">
    <head>
        <title>Student information form</title>
    </head>
    <body>
        <form>
         <label>Full Name:</label>
         <input type="text">

         <br><br>

         <label>Age:</label>
         <input type="number">

         <br><br>

         <label>Gender:</label>
         <input type="radio" name="gender"> Male
         <input type="radio" name="gender"> Female
         <input type="radio" name="gender"> Other

         <br><br>

         <label>Course:</label>
         <input type="radio" name="course"> BCA
         <input type="radio" name="course"> BSc
         <input type="radio" name="course"> BTech
        </form>
    </body>
 </html>
